spring.application.name=favourites-service
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/favourites_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agence_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:agence_password}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
announcements.service.url=${ANNOUNCEMENTS_SERVICE_URL:http://localhost:8081/api/announcements}
